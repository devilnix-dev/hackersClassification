<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Внешний пустой круг (только обводка) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1E90FF" stroke-width="8"/>
  
  <!-- Вертикальный прямоугольник (палка восклицательного знака) - без закругления, длиннее на четверть вверх -->
  <rect x="90" y="40" width="20" height="75" fill="#1E90FF"/>
  
  <!-- Внутренний круг (точка восклицательного знака) -->
  <circle cx="100" cy="140" r="10" fill="#1E90FF"/>
</svg>